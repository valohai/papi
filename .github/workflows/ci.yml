name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: 'true'
    - name: Run test
      run: uv run --all-extras --with=pytest-cov pytest --cov papi .
  Lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.14"
        activate-environment: 'true'
    - name: Install dependencies
      run: uv sync
    - name: Run format check
      run: make check-format
    - name: Run lint
      run: make lint
